name: windows
# Builds the Windows download and installs it on real Windows machines, then checks that it works (packaging/windows_test.py).
on:
  push:
    paths: ['server/**', 'packaging/windows_test.py', 'packaging/build-win.sh', '.github/workflows/windows.yml']
  pull_request:
    paths: ['server/**', 'packaging/windows_test.py', 'packaging/build-win.sh', '.github/workflows/windows.yml']
  workflow_dispatch:
    inputs:
      released:
        description: "Also install the newest published release with get.ps1 (the one-line install)"
        type: boolean
        default: false
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build nova-windows.zip
        run: packaging/build-win.sh
      - uses: actions/upload-artifact@v4
        with: { name: nova-windows, path: dist/nova-windows.zip }
  server:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/download-artifact@v4
        with: { name: nova-windows, path: dl }
      - name: Install Nova from the zip
        shell: powershell
        run: |
          Expand-Archive -Path dl\nova-windows.zip -DestinationPath dl -Force
          $py = (Get-Command python).Source
          powershell -NoProfile -ExecutionPolicy Bypass -File dl\Nova\windows\install.ps1 -Python $py
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Test
        shell: powershell
        run: |
          & "$env:ProgramFiles\Nova\venv\Scripts\python.exe" packaging\windows_test.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Install again over itself (an update keeps settings and devices)
        shell: powershell
        run: |
          $before = Get-Content "$env:ProgramData\Nova\data\tls\cert.pem" -Raw
          $py = (Get-Command python).Source
          powershell -NoProfile -ExecutionPolicy Bypass -File dl\Nova\windows\install.ps1 -Python $py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ((Get-Content "$env:ProgramData\Nova\data\tls\cert.pem" -Raw) -ne $before) { Write-Host "the certificate changed: paired phones would stop trusting the server"; exit 1 }
          $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 10 http://127.0.0.1:8095/api/v1/ping
          if ($r.StatusCode -ne 200) { exit 1 }
      - name: Logs
        if: always()
        shell: powershell
        run: |
          foreach ($f in Get-ChildItem "$env:ProgramData\Nova\log\*.log" -ErrorAction SilentlyContinue) { Write-Host "`n===== $($f.Name)"; Get-Content $f.FullName -Tail 80 }
          Get-ScheduledTask -TaskPath '\Nova\' -ErrorAction SilentlyContinue | Get-ScheduledTaskInfo | Format-Table TaskName, LastRunTime, LastTaskResult -AutoSize
      - name: Uninstall
        if: always()
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:ProgramFiles\Nova\uninstall.ps1" -Purge
          if (Test-Path "$env:ProgramFiles\Nova") { Write-Host "left behind:"; Get-ChildItem "$env:ProgramFiles\Nova" -Recurse | Select-Object -First 20 FullName; exit 1 }
          if (Test-Path "$env:ProgramData\Nova") { Write-Host "data left behind after -Purge"; exit 1 }
          if (Get-ScheduledTask -TaskPath '\Nova\' -ErrorAction SilentlyContinue) { Write-Host "tasks left behind"; exit 1 }
          if (Get-NetFirewallRule -Group 'Nova' -ErrorAction SilentlyContinue) { Write-Host "firewall rules left behind"; exit 1 }
  released:
    # The one-line install, against what is actually published. Run by hand after a release (Actions → windows → Run workflow).
    if: github.event_name == 'workflow_dispatch' && inputs.released
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: get.ps1
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File get.ps1
          $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 10 http://127.0.0.1:8095/api/v1/ping
          if ($r.StatusCode -ne 200) { exit 1 }
          & "$env:ProgramFiles\Nova\venv\Scripts\python.exe" packaging\windows_test.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
