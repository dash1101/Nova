name: macos
# Builds the macOS download and installs it on a real Mac, then checks that it works (packaging/mac_test.py).
on:
  push:
    paths: ['server/**', 'packaging/mac_test.py', 'packaging/build-mac.sh', '.github/workflows/macos.yml', 'get.sh']
  pull_request:
    paths: ['server/**', 'packaging/mac_test.py', 'packaging/build-mac.sh', '.github/workflows/macos.yml', 'get.sh']
  workflow_dispatch:
    inputs:
      released:
        description: "Also install the newest published release with get.sh (the one-line install)"
        type: boolean
        default: false
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build nova-macos.tar.gz
        run: packaging/build-mac.sh
      - uses: actions/upload-artifact@v4
        with: { name: nova-macos, path: dist/nova-macos.tar.gz }
  server:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, python: /usr/bin/python3 }       # Apple Silicon, the Python that comes with Apple's command line tools (3.9)
          - { os: macos-latest, python: '' }                     # …and whichever newer Python the installer finds first (Homebrew's)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: nova-macos, path: dl }
      - name: Install Nova from the download
        run: |
          tar -xzf dl/nova-macos.tar.gz -C dl
          # the way a hub app (Orbit) runs it: output captured; the last line says what happened
          sudo sh dl/Nova/mac/install.sh --quiet ${{ matrix.python && format('--python {0}', matrix.python) || '' }} | tee install.log
          line="$(grep '^NOVA-RESULT ' install.log | tail -1)"; [ -n "$line" ] || { echo "no NOVA-RESULT line"; exit 1; }
          echo "${line#NOVA-RESULT }" | python3 -c "
          import json, sys
          r = json.load(sys.stdin); print(r)
          assert r['ok'] and r['firstRun'] and not r['previous'] and r['running'] and r['ports']['https'] == 8495 and r['urls']['local'] == 'https://127.0.0.1:8495', 'unexpected result'"
      - name: Test
        env:
          GITHUB_TOKEN: ${{ github.token }}      # (only for looking up Nova's newest release without GitHub's anonymous limit)
        run: /usr/local/lib/nova/venv/bin/python packaging/mac_test.py
      - name: Install again over itself (an update keeps settings and devices)
        run: |
          before="$(sudo shasum -a 256 '/Library/Application Support/Nova/data/tls/cert.pem')"
          sudo sh dl/Nova/mac/install.sh --quiet | tee install2.log
          grep '^NOVA-RESULT ' install2.log | tail -1 | sed 's/^NOVA-RESULT //' | python3 -c "
          import json, sys
          r = json.load(sys.stdin); print(r)
          assert r['ok'] and not r['firstRun'] and r['previous'] and r['running'], 'an update should say so'"
          [ "$before" = "$(sudo shasum -a 256 '/Library/Application Support/Nova/data/tls/cert.pem')" ] || { echo "the certificate changed: paired phones would stop trusting the server"; exit 1; }
          curl -fs -m 10 http://127.0.0.1:8095/api/v1/ping
      - name: Logs
        if: always()
        run: |
          sudo sh -c 'for f in "/Library/Application Support/Nova/log/"*.log; do echo; echo "===== $f"; tail -n 60 "$f"; done' || true
          sudo launchctl print system/app.novalabs.nova.api 2>/dev/null | sed -n 1,25p || true
      - name: Uninstall
        if: always()
        run: |
          sudo /usr/local/bin/nova uninstall --purge --yes | tee un.log
          grep -q '^NOVA-RESULT {"ok":true' un.log || { echo "uninstall didn't report success"; exit 1; }
          for p in /usr/local/lib/nova "/Library/Application Support/Nova" /usr/local/bin/nova "/Applications/Nova Server.app"; do
            [ ! -e "$p" ] || { echo "left behind: $p"; exit 1; }
          done
          ls /Library/LaunchDaemons | grep -q novalabs && { echo "services left behind"; exit 1; } || true
          dscl . -read /Users/nova-api >/dev/null 2>&1 && { echo "the nova-api account was left behind"; exit 1; } || true
          pgrep -fl /usr/local/lib/nova && { echo "something of Nova's is still running"; exit 1; } || true
  released:
    # The one-line install, against what is actually published. Run by hand after a release (Actions → macos → Run workflow).
    if: github.event_name == 'workflow_dispatch' && inputs.released
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: get.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sh get.sh
          curl -fs -m 10 http://127.0.0.1:8095/api/v1/ping
          /usr/local/lib/nova/venv/bin/python packaging/mac_test.py
      - name: nova update finds nothing newer than the release it just installed
        run: sudo /usr/local/bin/nova update --check
