name: ci
on: [push, pull_request]
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y python3-cryptography
      - name: Syntax check
        run: |
          python3 -m py_compile server/api/*.py packaging/pentest.py
          for f in server/api/*; do if head -1 "$f" | grep -q python; then python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$f"; fi; done
          for f in server/api/*; do if head -1 "$f" | grep -q bash; then bash -n "$f"; fi; done
          bash -n server/install.sh packaging/build-deb.sh packaging/release.sh
          # Windows PowerShell reads a script without a byte-order mark as ANSI, where some UTF-8 bytes become quote marks: keep these plain ASCII
          if grep -nP '[^\x00-\x7F]' server/windows/*.ps1 get.ps1; then echo 'non-ASCII characters in a .ps1 file'; exit 1; fi
          # macOS's sh (bash 3.2) reads "$NAME…" as a variable called NAME-plus-a-byte: braces are needed before any non-ASCII character
          if grep -nP '\$[A-Za-z_][A-Za-z0-9_]*[^\x00-\x7F]' get.sh server/mac/*.sh; then echo 'a $VARIABLE directly followed by a non-ASCII character (write ${VARIABLE})'; exit 1; fi
          for f in server/web/*.js; do node --check "$f"; done
      - name: Controlling another server from Nova web (the relay takes the web's headers)
        run: python3 packaging/relay_test.py
      - name: No name is used that nothing defines
        run: |
          # (a library imported inside one function and used in another — it ran fine until that other function did:
          #  0.10.0 stopped the monitor on every Discord post that way)
          pip install -q pyflakes
          bad=0; for f in server/api/*.py server/monitor/*.py server/api/nova server/api/nova-gui server/api/nova-setup server/api/nova-setup-gui server/api/nova-update packaging/*.py; do
            python3 -m pyflakes "$f" 2>&1 | grep -E "undefined name|referenced before assignment" && bad=1; done
          [ "$bad" = 0 ]
      - name: Build package
        run: packaging/build-deb.sh
      - name: The tarball unpacks the way every installed updater unpacks it
        run: |
          # nova-update extracts with tarfile's "data" filter, which (Python 3.12+) refuses absolute links: one broke
          # every tarball update in 0.9.23. Servers keep their old updater, so the tarball itself must stay safe.
          packaging/build-tar.sh >/dev/null
          python3 -c "import glob, tarfile, tempfile; t = tarfile.open(glob.glob('dist/nova-server_*.tar.gz')[0]); t.extractall(tempfile.mkdtemp(), filter='data'); print('ok')"
      - name: A release has exactly one file a Linux updater takes for its tarball
        run: |
          # Installed updaters pick the last file named nova-server_<version>.tar.gz. Another system's package with a name
          # of that shape (the Mac's once was) could be picked instead — today or after a version without "-alpha".
          packaging/build-mac.sh >/dev/null; packaging/build-win.sh >/dev/null
          python3 -c "
          import os, re
          names = sorted(os.listdir('dist')); hits = [n for n in names if re.fullmatch(r'nova-server_[\w.~+-]+\.tar\.gz', n)]
          print(names); assert len(hits) == 1, hits"
      - uses: actions/upload-artifact@v4
        with: { name: nova-server-deb, path: dist/*.deb }
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # the runner image already has the Android SDK (ANDROID_HOME); setup-android's sdkmanager step breaks on it
      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: nova-debug-apk, path: android/app/build/outputs/apk/debug/*.apk }
