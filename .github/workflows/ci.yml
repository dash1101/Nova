name: ci
on: [push, pull_request]
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y python3-cryptography
      - name: Syntax check
        run: |
          python3 -m py_compile server/api/*.py packaging/pentest.py
          for f in server/api/*; do if head -1 "$f" | grep -q python; then python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$f"; fi; done
          for f in server/api/*; do if head -1 "$f" | grep -q bash; then bash -n "$f"; fi; done
          bash -n server/install.sh packaging/build-deb.sh packaging/release.sh
          for f in server/web/*.js; do node --check "$f"; done
      - name: Build package
        run: packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with: { name: nova-server-deb, path: dist/*.deb }
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # the runner image already has the Android SDK (ANDROID_HOME); setup-android's sdkmanager step breaks on it
      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: nova-debug-apk, path: android/app/build/outputs/apk/debug/*.apk }
