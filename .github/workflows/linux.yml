name: linux
# Installs the server package on a fresh Ubuntu machine (real systemd), sets it up unattended, then checks it the way a
# person would (packaging/linux_test.py) and runs the full security test (packaging/pentest.py) against it.
on:
  push:
    paths: ['server/**', 'packaging/**', '.github/workflows/linux.yml']
  pull_request:
    paths: ['server/**', 'packaging/**', '.github/workflows/linux.yml']
  workflow_dispatch:
    inputs:
      released:
        description: "Also install a published release with get.sh (the one-line install) and check it"
        type: boolean
        default: false
      tag:
        description: "…a particular release instead of the newest regular one (a beta before it's promoted: v1.0.0-beta.1)"
        type: string
        default: ""
jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and install the package
        run: |
          packaging/build-deb.sh
          sudo apt-get update -qq
          sudo apt-get install -y -qq ./dist/nova-server_*_all.deb
      - name: Set up, unattended
        run: packaging/ci-setup.sh
      - name: Check it like a person would
        run: python3 packaging/linux_test.py
      - name: A tarball install's leftover marker doesn't change how a .deb install updates
        run: |
          sudo touch /usr/lib/nova-api/INSTALLED_FROM_TARBALL
          sudo python3 -c "import importlib.machinery as m, importlib.util as u; l = m.SourceFileLoader('nu', '/usr/sbin/nova-update'); x = u.module_from_spec(u.spec_from_loader('nu', l)); l.exec_module(x); assert not x.TARBALL, 'took the tarball path'; print('deb path: ok')"
          sudo dpkg -i ./dist/nova-server_*_all.deb >/dev/null
          test ! -e /usr/lib/nova-api/INSTALLED_FROM_TARBALL && echo "installing the .deb removed the stale marker"
          for i in $(seq 30); do curl -sf http://127.0.0.1:8095/api/v1/ping >/dev/null && break; sleep 1; done
      - name: Nova updates itself (a release in a folder, signed with a key made for this run)
        run: |
          # The updater is what every installed server depends on for its next version, so it runs here for real:
          # the signed list alone for a check, then this system's package and the app for the update — and nothing else.
          R=/tmp/rel; mkdir -p $R && cp dist/nova-server_*_all.deb $R/ && head -c 300000 /dev/urandom > $R/nova-universal.apk
          # another system's package, listed with a checksum it doesn't have: an updater that still fetched and checked
          # the whole release would stop on it; one that takes only what this server installs never looks at it
          head -c 100000 /dev/urandom > $R/nova-windows.zip
          (cd $R && sha256sum nova-server_*_all.deb nova-universal.apk > SHA256SUMS && echo "$(printf 0%.0s $(seq 64))  nova-windows.zip" >> SHA256SUMS)
          openssl genpkey -algorithm ed25519 -out /tmp/k.pem && openssl pkey -in /tmp/k.pem -pubout -out /tmp/k.pub
          openssl pkeyutl -sign -inkey /tmp/k.pem -rawin -in $R/SHA256SUMS | base64 -w0 > $R/SHA256SUMS.sig
          sudo cp /usr/lib/nova-api/release-key.pub /tmp/real-key.pub && sudo cp /tmp/k.pub /usr/lib/nova-api/release-key.pub
          sudo nova-update $R --check | tee /tmp/check.txt; grep -q "up to date" /tmp/check.txt
          sudo nova-update $R --reinstall | tee /tmp/upd.txt
          grep -q "installed — settings and paired devices kept" /tmp/upd.txt || { sudo cat /var/lib/nova-api/update.json; exit 1; }
          sudo python3 -c "import json; s=json.load(open('/var/lib/nova-api/update.json')); print(s); assert s['state'] == 'done', s"
          for i in $(seq 30); do curl -sf http://127.0.0.1:8095/api/v1/ping >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8095/api/v1/ping
          cmp /usr/lib/nova-api/release-key.pub packaging/release-key.pub && echo "the installed package brought Nova's own release key back"
          # …and with it back, a list that key didn't sign is refused
          if sudo nova-update $R --check; then echo "accepted a list Nova's release key didn't sign"; exit 1; fi
      - name: Security test
        run: |
          mkdir -p pt && cd pt
          sudo python3 ../packaging/pentest.py register > pt.json
          sudo python3 -c "import json; p='/var/lib/nova-api/devices.json'; d=json.load(open(p)) if __import__('os').path.exists(p) else {}; d.update(json.load(open('pt.json'))); json.dump(d, open(p,'w'))"
          sudo chown nova-api:nova-api /var/lib/nova-api/devices.json; sudo chmod 640 /var/lib/nova-api/devices.json
          NOVA_HOST=$NOVA_HOST timeout 1500 python3 ../packaging/pentest.py | tee pentest.log
          tail -1 pentest.log; grep "^FAIL" pentest.log || true
          python3 -c "import sys,re; l=open('pentest.log').read().strip().splitlines()[-1]; m=re.match(r'(\d+)/(\d+)', l); sys.exit(0 if m and int(m.group(1)) >= int(m.group(2)) - 3 else 1)"
      - name: Logs
        if: always()
        run: |
          sudo journalctl -u nova-api -u 'nova-helper@*' -n 120 --no-pager || true
          sudo nova doctor || true
  upgrade:
    # The previously published release, set up and paired — then updated to the build under test by that release's own
    # updater, the way every installed server gets its next version. The paired device must still get in afterwards.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: The newest published release, installed the one-line way
        run: |
          sh get.sh
          packaging/ci-setup.sh
      - name: Pair a device with it
        run: python3 packaging/upgrade_test.py before
      - name: Update to this build with the old release's updater
        run: |
          packaging/build-deb.sh
          R=/tmp/rel; mkdir -p $R && cp dist/nova-server_*_all.deb $R/
          (cd $R && sha256sum nova-server_*_all.deb > SHA256SUMS)
          openssl genpkey -algorithm ed25519 -out /tmp/k.pem && openssl pkey -in /tmp/k.pem -pubout -out /tmp/k.pub
          openssl pkeyutl -sign -inkey /tmp/k.pem -rawin -in $R/SHA256SUMS | base64 -w0 > $R/SHA256SUMS.sig
          sudo cp /tmp/k.pub /usr/lib/nova-api/release-key.pub      # (this build is signed by a key made for this run)
          sudo nova-update $R --reinstall --allow-downgrade | tee /tmp/upd.txt
          grep -q "installed — settings and paired devices kept" /tmp/upd.txt || { sudo cat /var/lib/nova-api/update.json; exit 1; }
          echo "NOVA_EXPECT_VERSION=$(grep -oP 'API_VERSION = "\K[^"]+' server/api/server.py)" >> $GITHUB_ENV
      - name: The paired device still gets in
        run: python3 packaging/upgrade_test.py after
      - name: Logs
        if: always()
        run: sudo journalctl -u nova-api -n 60 --no-pager || true
  released:
    # The one-line install against what is actually published — or, with a tag, against a beta before it's promoted.
    if: github.event_name == 'workflow_dispatch' && inputs.released
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NOVA_RELEASE_URL: ${{ inputs.tag && format('https://github.com/dash1101/Nova/releases/download/{0}', inputs.tag) || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: get.sh
        run: |
          sh get.sh
          packaging/ci-setup.sh
      - name: Check it like a person would
        run: python3 packaging/linux_test.py
      - name: The updater finds this release, and nothing newer
        run: |
          [ -z "${{ inputs.tag }}" ] || sudo nova update --beta --check
          sudo nova update --check | tee /tmp/check.txt; grep -q "up to date" /tmp/check.txt
      - name: Updating it over itself works (downloaded from GitHub, signature checked)
        run: |
          sudo nova update --reinstall | tee /tmp/upd.txt
          grep -q "installed — settings and paired devices kept" /tmp/upd.txt
          for i in $(seq 30); do curl -sf http://127.0.0.1:8095/api/v1/ping >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8095/api/v1/ping
